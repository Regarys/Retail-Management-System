<!DOCTYPE html>
<html lang="id">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Toko Jerjon</title>
	<link rel="icon" type="image" href="Jerjon.png">
	<link href="css/style.css" rel="stylesheet">
</head>

<body>
	<div class="page">
		<header class="header">
			<div class="brand">
				<img class="brand-mark" src="Jerjon.png" alt="logo Jerjon">
				<div class="brand-text">
					<h1>Toko Jerjon</h1>
					<p>Manajemen produk</p>
				</div>
			</div>
			<div class="buttonContainer">
				<button type="button" class="btn btn-ghost" id="refreshBtn">Refresh</button>
				<button type="button" class="btn btn-add" id="addInvoiceBtn">Faktur</button>
			</div>
		</header>

		<main class="layout">

			<section class="card" aria-labelledby="formTitle">
				<div class="card-head">
					<h2 id="formTitle">Tambah Produk</h2>
					<span class="badge badge-edit" id="editBadge" hidden>Mode ubah</span>
				</div>

				<form id="productForm" novalidate>
					<div class="field">
						<label for="nameProduct">Nama barang</label>
						<input type="text" id="nameProduct" name="name_product" maxlength="120" autocomplete="off"
							placeholder="Indomie Goreng" required>
						<p class="error" id="errName" hidden></p>
					</div>

					<div class="field-row">
						<div class="field">
							<label for="price">Harga satuan</label>
							<input type="number" id="price" name="price" min="0" step="1" inputmode="numeric"
								placeholder="2500">
							<p class="error" id="errPrice" hidden></p>
						</div>
						<div class="field">
							<label for="priceTotal">Total</label>
							<input type="number" id="priceTotal" name="price_total" min="0" step="1" inputmode="numeric"
								placeholder="60000" required>
							<p class="error" id="errTotal" hidden></p>
						</div>
					</div>

					<div class="form-actions">
						<button type="submit" class="btn btn-primary" id="submitBtn">Simpan</button>
						<button type="button" class="btn btn-ghost" id="cancelBtn" hidden>Batal</button>
						<button type="reset" class="btn btn-ghost" id="resetBtn">Reset</button>
					</div>
				</form>
			</section>

			<section class="card" aria-labelledby="listTitle">
				<div class="card-head">
					<h2 id="listTitle">Daftar produk</h2>
					<span class="badge" id="countBadge">0 produk</span>
				</div>

				<div class="toolbar">
					<input type="search" id="searchInput" placeholder="Cari nama barang..." aria-label="Cari produk"
						autocomplete="off">
				</div>

				<div class="table-wrap" id="tableWrap">
					<table>
						<thead>
							<tr>
								<th class="col-no">No</th>
								<th>Nama barang</th>
								<th class="num">Harga</th>
								<th class="num">Total</th>
								<th class="hide-sm">Dibuat</th>
								<th class="col-act">Aksi</th>
							</tr>
						</thead>
						<tbody id="productBody"></tbody>
					</table>
				</div>
			</section>

		</main>
	</div>

	<div class="modal" id="deleteModal" hidden>
		<div class="modal-backdrop" data-close></div>
		<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
			<h3 id="deleteTitle">Hapus produk?</h3>
			<p id="deleteText"></p>
			<div class="modal-actions">
				<button type="button" class="btn btn-ghost" id="deleteCancel">Batal</button>
				<button type="button" class="btn btn-danger" id="deleteConfirm">Hapus</button>
			</div>
		</div>
	</div>

	<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

	<script src="js/app.js"></script>
</body>

</html>
